openapi: 3.0.3
info:
  title: Recoletas.Booking API
  version: 1.0.0
  description: API for diagnostic-test appointments, holds, and waitlists.
servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://localhost:5001
    description: Local development (HTTPS)
tags:
  - name: Patients
    description: Patient registration.
  - name: Slots
    description: Slot discovery and temporary holds.
  - name: Holds
    description: Confirmation of held slots.
  - name: Appointments
    description: Confirmed appointment lookup, pending hold/offer discovery, and cancellation.
  - name: Waitlist
    description: Joining the waitlist.
  - name: Offers
    description: Accepting or declining a waitlist offer.
  - name: Admin appointments
    description: Read-only access to currently confirmed appointments for administrators.
paths:
  /health/live:
    get:
      summary: Check process liveness
      operationId: checkLiveness
      security: []
      responses:
        '200':
          description: The HTTP process is running; dependency connectivity is not checked.
          content:
            text/plain:
              schema:
                type: string
                example: Healthy
  /health/ready:
    get:
      summary: Check database and broker readiness
      operationId: checkReadiness
      security: []
      responses:
        '200':
          description: PostgreSQL is reachable and the cached RabbitMQ connection is open.
          content:
            text/plain:
              schema:
                type: string
                example: Healthy
        '503':
          description: A dependency is unavailable. No connection or error details are exposed.
          content:
            text/plain:
              schema:
                type: string
                example: Unhealthy
  /patients:
    post:
      tags: [Patients]
      summary: Register a patient
      operationId: registerPatient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '200':
          description: Patient registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The supplied NHC is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: patient_nhc_already_exists
                message: A patient with this NHC already exists.
  /slots:
    get:
      tags: [Slots]
      summary: List available slots
      description: Returns slots effectively available within the requested interval. `to` must be later than `from`.
      operationId: getSlots
      security:
        - BearerAuth: []
      parameters:
        - name: testType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TestType'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Matching slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /slots/{id}/hold:
    post:
      tags: [Slots]
      summary: Place a temporary hold on a slot
      operationId: holdSlot
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Hold result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /holds/{id}/confirm:
    post:
      tags: [Holds]
      summary: Confirm a held slot
      operationId: confirmHold
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmHoldRequest'
      responses:
        '200':
          description: Appointment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel an appointment
      operationId: cancelAppointment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Appointment cancelled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /waitlist:
    post:
      tags: [Waitlist]
      summary: Join the waitlist for a test type
      operationId: joinWaitlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWaitlistRequest'
      responses:
        '200':
          description: Waitlist result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /offers/{id}/accept:
    post:
      tags: [Offers]
      summary: Accept a waitlist offer
      operationId: acceptOffer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
      responses:
        '200':
          description: Appointment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /offers/{id}/decline:
    post:
      tags: [Offers]
      summary: Decline a waitlist offer
      operationId: declineOffer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineOfferRequest'
      responses:
        '204':
          description: Offer declined
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /appointments:
    get:
      tags: [Appointments]
      summary: List the current patient's appointments
      operationId: getAppointments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Patient appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /appointments/pending:
    get:
      tags: [Appointments]
      summary: List the current patient's pending holds and offers
      description: >-
        Requires a patient token and uses only its patientId claim. Returns all current Held or
        Offered slots assigned to that patient whose corresponding expiry and slot end are
        strictly later than the server's current UTC time. Results are ordered by expiry, then
        slot start, then slot ID. No pagination, history, or filters are supported. A slot may have
        started but must not have ended, matching existing confirmation rules. This read does not
        extend leases or modify state. Use kind and generation with the existing hold-confirm or
        offer-accept route. The response is a snapshot: a later action can still return 409 if
        the pending item expires or changes.
      operationId: getPendingAppointments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current pending holds and offers, or an empty array when none match.
          headers:
            Cache-Control:
              description: Includes no-store to prevent caching patient-specific pending state.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingAppointmentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/appointments:
    get:
      tags: [Admin appointments]
      summary: List confirmed appointments for an interval
      description: Returns only reservations still referenced by their slot in Confirmed state. The interval is based on slot start time and is inclusive of `from` and exclusive of `to`.
      operationId: getAdminAppointments
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Currently confirmed appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAppointmentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Externally issued JWT with a non-empty `sub` claim and one `role` claim. Patient tokens
        require `role=patient` and a GUID `patientId` claim. Admin tokens require `role=admin` and
        must not contain `patientId`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request. Validation failures may be returned as the API error shape or ASP.NET validation problem details, depending on whether validation ran in the application or during HTTP model binding.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: Missing or invalid bearer token or booking identity claims
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated token does not have the role required for this endpoint
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Operation conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegisterPatientRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required and must not be empty or whitespace.
        nhc:
          type: string
          nullable: true
          maxLength: 100
          description: Optional unique NHC; surrounding whitespace is trimmed and whitespace-only values are treated as null.
    ConfirmHoldRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          format: int32
          minimum: 1
    JoinWaitlistRequest:
      type: object
      required: [testType]
      properties:
        testType:
          $ref: '#/components/schemas/TestType'
    TestType:
      type: string
      enum: [BloodTest, Ultrasound, MRI]
    AcceptOfferRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          format: int32
          minimum: 1
    DeclineOfferRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          format: int32
          minimum: 1
    PatientSummary:
      type: object
      required: [patientId, name, createdAtUtc]
      properties:
        patientId:
          type: string
          format: uuid
        name:
          type: string
        nhc:
          type: string
          nullable: true
          description: The trimmed NHC value, or null when omitted or blank.
        createdAtUtc:
          type: string
          format: date-time
    SlotSummary:
      type: object
      required: [slotId, testType, startsAtUtc, endsAtUtc, state]
      properties:
        slotId:
          type: string
          format: uuid
        testType:
          $ref: '#/components/schemas/TestType'
        startsAtUtc:
          type: string
          format: date-time
        endsAtUtc:
          type: string
          format: date-time
        state:
          type: string
          enum: [Available]
    BookingResult:
      type: object
      required: [succeeded]
      properties:
        succeeded:
          type: boolean
        errorCode:
          type: string
          nullable: true
          enum:
            - patient_not_found
            - slot_not_found
            - slot_unavailable
            - hold_invalid_or_expired
            - offer_invalid_or_expired
            - appointment_not_found
        generation:
          type: integer
          format: int32
          nullable: true
        appointment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AppointmentSummary'
    AppointmentSummary:
      type: object
      required: [reservationId, slotId, patientId, testType, startsAtUtc, endsAtUtc, confirmedAtUtc]
      properties:
        reservationId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        testType:
          $ref: '#/components/schemas/TestType'
        confirmedAtUtc:
          type: string
          format: date-time
          description: UTC instant when the reservation was confirmed, not the appointment schedule.
        startsAtUtc:
          type: string
          format: date-time
          description: Scheduled slot start in UTC.
        endsAtUtc:
          type: string
          format: date-time
          description: Scheduled slot end in UTC.
    PendingAppointmentSummary:
      type: object
      additionalProperties: false
      required: [slotId, testType, startsAtUtc, endsAtUtc, kind, generation, expiresAtUtc]
      properties:
        slotId:
          type: string
          format: uuid
          description: Slot identifier used by the existing hold confirmation and offer acceptance routes.
        testType:
          $ref: '#/components/schemas/TestType'
        startsAtUtc:
          type: string
          format: date-time
          description: Slot start in UTC.
        endsAtUtc:
          type: string
          format: date-time
          description: Slot end in UTC.
        kind:
          type: string
          enum: [hold, offer]
          description: A hold can be confirmed; an offer can be accepted.
        generation:
          type: integer
          format: int32
          minimum: 1
          description: Current generation to submit with the corresponding confirmation or acceptance request.
        expiresAtUtc:
          type: string
          format: date-time
          description: Current hold or offer expiry in UTC; equality to server time means expired.
    AdminAppointmentSummary:
      type: object
      required: [reservationId, slotId, testType, startsAtUtc, endsAtUtc, confirmedAtUtc, patientId, patientName]
      properties:
        reservationId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        testType:
          $ref: '#/components/schemas/TestType'
        startsAtUtc:
          type: string
          format: date-time
        endsAtUtc:
          type: string
          format: date-time
        confirmedAtUtc:
          type: string
          format: date-time
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
    WaitlistResult:
      type: object
      required: [joined, alreadyJoined]
      properties:
        joined:
          type: boolean
          enum: [true]
        alreadyJoined:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          nullable: true
          description: Always null in a successful response; failures use the Error response.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Stable machine-readable API or business error code.
          enum:
            - patient_not_found
            - patient_nhc_already_exists
            - slot_not_found
            - slot_unavailable
            - hold_invalid_or_expired
            - offer_invalid_or_expired
            - appointment_not_found
            - already_joined
            - from_and_to_required
            - validation_failed
            - not_found
            - conflict
            - unauthorized
            - internal_server_error
        message:
          type: string
          description: Human-readable error message when provided.
        details:
          type: array
          description: Present for application validation failures; unsupported test types use unsupported_test_type as the detail code.
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
                example: unsupported_test_type
              message:
                type: string
    ValidationProblemDetails:
      type: object
      description: ASP.NET Core response for malformed JSON or HTTP model-binding failures.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
          example: 400
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        traceId:
          type: string
